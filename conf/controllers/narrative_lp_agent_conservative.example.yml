# Conservative risk profile — narrative_lp_agent
#
# Template. `trading_pair` and `pool_address` are filled in per-pool by the Phase 4/5
# deployment flow once a pool clears the on-chain + narrative funnel — they are NOT
# meant to be hand-edited to a fixed pool for production use.
#
# Rename to narrative_lp_agent_conservative.yml (git-ignored) once filled in, or use
# scripts/deploy.py (Phase 6) to generate it from this template + a chosen pool.

id: narrative_lp_agent_conservative
controller_name: narrative_lp_agent
controller_type: generic
risk_profile: conservative

# --- Network / pool (filled per-deployment) ---
connector_name: solana-mainnet-beta
lp_provider: meteora/clmm
trading_pair: "<FILL-IN>"       # e.g. "SOME-USDC"
pool_address: "<FILL-IN>"       # Meteora DLMM pool address

# --- Entry funnel (enforced by the Phase 4 discovery routine, not this controller) ---
min_volume_24h_quote: '50000'
min_volume_tvl_ratio: '0.15'
market_cap_min: null
market_cap_max: null
min_dwell_time_seconds: 3600     # 1h minimum pool age

# --- Position sizing / bins ---
total_amount_quote: '50'
side: 1                          # 1=BUY, 2=SELL, 3=RANGE (initial position)
position_width_pct: '1.0'        # wider bins
position_offset_pct: '0.01'
strategy_type: 0                 # 0=Spot, 1=Curve, 2=Bid-Ask

# --- Rebalancing ---
rebalance_threshold_pct: '2'     # wider auto-close threshold, fewer rebalances
uptrend_behavior: hold           # lock in gains, don't chase price up
downtrend_behavior: exit_to_stable   # avoid further IL, convert to stable
min_fee_to_cost_ratio: '2.5'     # stricter cost-benefit margin
estimated_rebalance_cost_quote: '0.05'

# --- Risk controls ---
stop_loss_pct: '15'
hedge_enabled: true
hedge_venue: null                 # not implemented yet — see controller README
hedge_ratio_pct: '100'

# --- Price zones (optional, leave null to anchor at current price) ---
sell_price_max: null
sell_price_min: null
buy_price_max: null
buy_price_min: null

autoswap: true
swap_buffer_pct: '0.01'
